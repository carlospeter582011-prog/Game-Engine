name: Build Nexus editor APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.*'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: bash tools/fetch-python.sh
      - run: bash tools/build-player.sh
      - run: bash tools/test-player.sh
      - run: flutter pub get
      - run: flutter analyze
      - name: Configure signing
        run: bash tools/prepare-signing.sh
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_STORE_PASSWORD: ${{ secrets.NEXUS_STORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
      - name: Build editor
        run: |
          flutter build apk --release
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/Nexus-Engine.apk
        env:
          NEXUS_STORE_PASSWORD: ${{ secrets.NEXUS_STORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Engine-APK
          path: output/Nexus-Engine.apk
          if-no-files-found: error
