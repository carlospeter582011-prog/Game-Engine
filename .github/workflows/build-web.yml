name: Build Nexus website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: bash tools/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Engine-Website
          path: build/web
          if-no-files-found: error
